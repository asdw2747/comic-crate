[package]
name = "comic-crate"
version = "1.0.1"
edition = "2021"
rust-version = "1.95"
description = "A lightweight, parallel comic archive converter (PDF/CBR to CBZ) and reader."
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "system_fonts",
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
egui = "0.37"
lopdf = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
] }
zip = { version = "9.5", default-features = false }
rfd = "0.18"
flate2 = "1.1"
hayro-jpeg2000 = "0.5"
fax = "0.2"
rayon = "1.12"
webp = "0.3"
unrar = "0.5"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
