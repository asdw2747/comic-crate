name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BIN_NAME: reel-rename
  APP_NAME: ReelRename

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows EXE
        run: cargo build --release
      - name: Stage Windows Release Asset
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item "target/release/${{ env.BIN_NAME }}.exe" "${{ env.BIN_NAME }}-$tag-windows-x86_64.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BIN_NAME }}-*-windows-x86_64.exe

  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev fuse libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux Binary
        run: cargo build --release
      - name: Package AppImage
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p AppDir/usr/bin
          cp "target/release/${BIN_NAME}" "AppDir/usr/bin/${BIN_NAME}"
          cp assets/icon.png "AppDir/${BIN_NAME}.png"
          ln -s "${BIN_NAME}.png" AppDir/.DirIcon

          cat << EOF > "AppDir/${BIN_NAME}.desktop"
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Exec=${BIN_NAME}
          Icon=${BIN_NAME}
          Categories=Utility;
          Terminal=false
          EOF

          cat << EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/${BIN_NAME}" "\$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q -O appimagetool https://github.com
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "${APP_NAME}-${TAG}-x86_64.AppImage"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-*-x86_64.AppImage
